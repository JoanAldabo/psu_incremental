<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar tarea</title>
</head>
<body>
    <h1>¿Eliminar esta tarea?</h1>

    <p>
        <strong>{{ tarea.titulo }}</strong>
        {% if tarea.descripcion %} — {{ tarea.descripcion }}{% endif %}
    </p>
    <p>Esta acción no se puede deshacer.</p>

    <form method="post">
        <button type="submit">Sí, eliminar</button>
    </form>
    <p><a href="{{ url_for('listar_tareas') }}">Cancelar y volver al listado</a></p>
</body>
</html>
