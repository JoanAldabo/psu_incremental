<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestor de tareas</title>
</head>
<body>
    <h1>Gestor de tareas</h1>
    <p><a href="{{ url_for('nueva_tarea') }}">+ Nueva tarea</a></p>

    {% if tareas %}
        <ul>
        {% for tarea in tareas %}
            <li>
                <strong>{{ tarea.titulo }}</strong>
                {% if tarea.descripcion %} — {{ tarea.descripcion }}{% endif %}
                ({{ "Completada" if tarea.completada else "Pendiente" }})
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No hay tareas todavía.</p>
    {% endif %}
</body>
</html>
