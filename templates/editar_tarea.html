<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar tarea</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Editar tarea</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post" class="formulario-tarea">
        <label>Título (obligatorio):
            <input type="text" name="titulo" value="{{ tarea.titulo }}" required>
        </label>
        <label>Descripción (opcional):
            <textarea name="descripcion">{{ tarea.descripcion or '' }}</textarea>
        </label>
        <button type="submit">Guardar cambios</button>
    </form>

    <p><a href="{{ url_for('listar_tareas') }}">Volver al listado</a></p>
</body>
</html>
